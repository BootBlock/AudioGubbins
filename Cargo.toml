# AudioGubbins Cargo workspace.
#
# `cargo test --workspace` is part of every phase's verification (REQ-REPO-186,
# REQ-REPO-192). The members are the Rust half of the version contract
# (REQ-REPO-187) and the canonical DSP Phase 03 owns: deterministic primitives,
# the resampler, and the narrow WebAssembly boundary the TypeScript engine
# reaches them through (ADR-0031, ADR-0032). The analysis crate REQ-REPO-154
# names belongs to the phases that analyse audio.

[workspace]
resolver = "3"
members = [
  "crates/audiogubbins-version",
  "crates/dsp-core",
  "crates/resampling",
  "crates/wasm-bindings",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/BootBlock/AudioGubbins"
authors = ["The AudioGubbins Authors"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
