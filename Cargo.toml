# AudioGubbins Cargo workspace.
#
# Phase 01 establishes the workspace so that `cargo test --workspace` is part of
# verification from the first commit, and so the Rust toolchain is wired into CI
# before any DSP code depends on it (REQ-REPO-186, REQ-REPO-192).
#
# The DSP crates named by REQ-REPO-154 (dsp-core, resampling, analysis,
# wasm-bindings) are owned by Phase 03 - Audio Engine Foundation. They are
# deliberately absent here rather than stubbed: REQ-EXEC-181 treats an empty
# placeholder implementation as a gate failure, and REQ-EXEC-136.9 prohibits
# partially implementing a later phase.
#
# The one member is the Rust half of the version contract that REQ-REPO-187
# places in this phase. Cargo rejects a workspace with no members, so a wholly
# empty skeleton could not satisfy the packet own `cargo test --workspace`
# verification command.

[workspace]
resolver = "3"
members = ["crates/audiogubbins-version"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/BootBlock/AudioGubbins"
authors = ["The AudioGubbins Authors"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
