# AudioGubbins Cargo workspace.
#
# `cargo test --workspace` is part of every phase's verification (REQ-REPO-186,
# REQ-REPO-192). The members are the Rust half of the version contract
# (REQ-REPO-187) and the canonical DSP Phase 03 owns: deterministic primitives,
# the resampler, and the narrow WebAssembly boundary the TypeScript engine
# reaches them through (ADR-0031, ADR-0032). The analysis crate REQ-REPO-154
# names is Phase 06's: what measures audio rather than changes it (ADR-0061).
# The codec module is Phase 09's: decoding and encoding behind a narrow
# boundary of its own, built into a WebAssembly module apart from the DSP's
# (ADR-0091), whose objects are named by handle as the DSP module's are.

[workspace]
resolver = "3"
members = [
  "crates/analysis",
  "crates/audiogubbins-version",
  "crates/codec-bindings",
  "crates/codecs",
  "crates/dsp-core",
  "crates/handle-table",
  "crates/resampling",
  "crates/wasm-bindings",
]
# Vendored crates are patched in below, never members: their lints and tests are
# their authors'.
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/BootBlock/AudioGubbins"
authors = ["The AudioGubbins Authors"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Symphonia's Vorbis decoder at the version the lockfile pins, vendored with
# two fixes to its multichannel decoding (third_party/symphonia-codec-vorbis/README.md).
[patch.crates-io]
symphonia-codec-vorbis = { path = "third_party/symphonia-codec-vorbis/crate" }
